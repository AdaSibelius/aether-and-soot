<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether &amp; Soot — Victorian Steampunk Roguelike</title>
    <link rel="stylesheet" href="/node_modules/@fontsource/ibm-plex-mono/index.css" />
    <style>
      :root {
        --bg-soot: #101615;
        --panel-bg: #202A28;
        --panel-border: #355B54;
        --panel-border-bright: #C1A15B;
        --brass-gold: #C1A15B;
        --oxidized-copper: #cd7f32;
        --tesla-cyan: #355B54;
        --parchment: #D9CCAA;
        --muted-slate: #7a868a;
        --ok-green: #52be80;
        --warn-red: #B94B42;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-soot);
        color: var(--parchment);
        font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .app-frame {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #050708;
        position: relative;
        overflow: hidden;
      }
      .viewport-column {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        position: relative;
      }
      #hud-root:empty,
      #top-bar-root:empty,
      #action-bar-root:empty {
        display: none !important;
      }
      #canvas-stage {
        border: 2px solid #221c15;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        overflow: hidden;
        box-shadow: 0 0 32px rgba(212, 175, 55, 0.18), inset 0 0 16px rgba(0, 0, 0, 0.95);
      }
      #canvas-stage canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .hud-sidebar {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .panel-box {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        padding: 8px 10px;
        font-size: 11px;
        box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.6);
      }
      .panel-header {
        color: var(--brass-gold);
        font-weight: bold;
        letter-spacing: 0.08em;
        border-bottom: 1px solid var(--panel-border);
        padding-bottom: 4px;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .stat-row,
      .limb-item {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }
      .brass-text {
        color: var(--brass-gold);
      }
      .copper-text {
        color: var(--oxidized-copper);
      }
      .tesla-text {
        color: var(--tesla-cyan);
      }
      .ok-text {
        color: var(--ok-green);
      }
      .warn-text {
        color: var(--warn-red);
      }
      .button-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      button {
        background: #11181c;
        color: var(--brass-gold);
        border: 1px solid var(--panel-border);
        padding: 4px 8px;
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
        text-align: left;
        transition: border-color 0.15s, background 0.15s;
      }
      button:hover {
        background: #1a252c;
        border-color: var(--brass-gold);
      }
      .log-box {
        flex: 1;
        min-height: 140px;
      }
      .log-entry {
        font-size: 11px;
        line-height: 1.4;
        padding: 2px 0;
        border-bottom: 1px dashed #172126;
      }
      .muted {
        color: var(--muted-slate);
      }
    </style>
  </head>
  <body>
    <div class="app-frame">
      <div class="viewport-column">
        <div id="top-bar-root"></div>
        <div id="canvas-stage"></div>
        <div id="action-bar-root"></div>
      </div>
      <div id="hud-root"></div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
